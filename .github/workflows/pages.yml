name: Test and deploy AlgoLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and progression
        run: |
          node --check app.js
          node --check learning-path.js
          node --check progress.js
          node --check nagold.js
          node --check nagold-table.js
          node --check python-worker.js
          node --check python-runner.js
          node --check python-checks.js
          node --check loop-model.js
          node --check analysis-model.js
          node --check array-ops-model.js
          node --check ds-model.js
          node --check practice.js
          node --check practice-check.js
          node --check config.js
          node --check ai-coach.js
          node --test tests/*.test.cjs
      - name: Assemble public files only
        run: |
          mkdir public
          cp index.html styles.css design.css app.js learning-path.js progress.js nagold.js nagold-table.js python-worker.js python-runner.js python-checks.js loop-model.js analysis-model.js array-ops-model.js ds-model.js practice.js practice-check.js config.js ai-coach.js public/
          cp -r assets public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
